[workspace]
members = ["packages/native", "packages/netmate-platform", "packages/netmate-core", "apps/agent", "apps/native-ui"]
resolver = "2"
default-members = ["packages/netmate-core", "packages/netmate-platform", "apps/agent", "apps/native-ui"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "ISC"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package.netmate-ui]
opt-level = "s"
