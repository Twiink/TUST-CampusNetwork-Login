name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '10.27.0'

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript 检查
        run: pnpm type-check

      - name: 单元与组件测试
        run: pnpm test

      - name: Prettier 检查
        run: pnpm format:check

  network-simulation:
    name: 网络模拟回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行共享层网络模拟测试
        run: pnpm test:network

      - name: 验证 Linux runner 支持 netem 链路整形
        run: |
          python3 -m http.server 38080 --bind 127.0.0.1 >/tmp/netmate-http.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            sudo tc qdisc del dev lo root 2>/dev/null || true
            kill "${SERVER_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for _ in {1..20}; do
            if curl -fsS -o /dev/null http://127.0.0.1:38080; then
              break
            fi
            sleep 0.5
          done

          curl -fsS -o /dev/null http://127.0.0.1:38080
          BASE_TIME="$(curl -fsS -o /dev/null -w '%{time_total}' http://127.0.0.1:38080)"
          sudo tc qdisc add dev lo root netem delay 120ms 20ms distribution normal
          SHAPED_TIME="$(curl -fsS -o /dev/null -w '%{time_total}' http://127.0.0.1:38080)"

          echo "base=${BASE_TIME}"
          echo "shaped=${SHAPED_TIME}"

          awk -v base="${BASE_TIME}" -v shaped="${SHAPED_TIME}" 'BEGIN { exit !(shaped > base + 0.05) }'

  desktop-build:
    name: 桌面端构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 验证原生模块 API
        shell: bash
        run: |
          cargo test -p netmate-native
          cargo build -p netmate-native --release
          binary="$(find target/release -type f \( -name 'libnetmate_native.so' -o -name 'netmate_native.dll' -o -name 'libnetmate_native.dylib' \) | head -n1)"
          destination="$(node -p "require('./packages/native/resolve-native.cjs').resolveNativeRequest(process.platform, process.arch).request.replace('./','packages/native/')")"
          mkdir -p "$(dirname "$destination")"
          cp "$binary" "$destination"
          node - <<'NODE'
          const n = require('./packages/native');
          if (n.__loadError) throw new Error(n.__loadError);
          for (const fn of ['currentWifi', 'networkInfo', 'watchNetwork']) {
            if (typeof n[fn] !== 'function') throw new Error(`missing export: ${fn}`);
          }
          const wifi = n.currentWifi();
          const info = n.networkInfo();
          if (wifi !== null && typeof wifi !== 'object') throw new Error('invalid currentWifi result');
          if (info !== null && typeof info !== 'object') throw new Error('invalid networkInfo result');
          console.log(`native API ok: wifi=${wifi ? 'object' : 'null'}, info=${info ? 'object' : 'null'}`);
          NODE

      - name: 构建 shared + desktop
        run: pnpm build

  desktop-e2e:
    name: 桌面 E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 运行真实主进程 E2E
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pnpm test:e2e
          else
            pnpm test:e2e
          fi
      - name: 验证桌面用例没有跳过
        shell: bash
        run: |
          node -e 'const { stats } = require("./apps/desktop/test-results/results.json"); if (stats.expected < 25 || stats.skipped || stats.unexpected) throw new Error("E2E incomplete: " + JSON.stringify(stats));'
      - name: 归档桌面诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: error

  android-build:
    name: Android 原生回归与 E2E 构建
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: 构建移动端共享依赖
        run: pnpm --filter @repo/shared build
      - name: 构建并验证原生单元测试
        working-directory: apps/mobile/android
        env:
          ANDROID_VERSION_CODE: '1001'
          ANDROID_VERSION_NAME: '1.0.1'
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileReleaseKotlin :app:assembleE2e :app:assembleE2eAndroidTest -Pe2eBuild -PreactNativeArchitectures=x86_64 --console=plain
          mkdir -p ../../../android-e2e-apks
          cp app/build/outputs/apk/e2e/app-e2e.apk ../../../android-e2e-apks/base.apk
          cp app/build/outputs/apk/androidTest/e2e/app-e2e-androidTest.apk ../../../android-e2e-apks/test.apk
      - name: 构建同签名更高版本更新包
        working-directory: apps/mobile/android
        env:
          ANDROID_VERSION_CODE: '1002'
          ANDROID_VERSION_NAME: '1.0.2'
        run: |
          ./gradlew :app:assembleE2e -Pe2eBuild -PreactNativeArchitectures=x86_64 --console=plain
          cp app/build/outputs/apk/e2e/app-e2e.apk ../../../android-e2e-apks/update.apk
          keytool -genkeypair -keystore /tmp/untrusted.jks -storepass android -keypass android -alias untrusted -keyalg RSA -validity 2 -dname 'CN=E2E Untrusted'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/untrusted.jks --ks-pass pass:android --key-pass pass:android --out ../../../android-e2e-apks/untrusted.apk ../../../android-e2e-apks/update.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-e2e-apks
          path: android-e2e-apks/*.apk
          if-no-files-found: error
      - name: 归档原生测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-results
          path: |
            apps/mobile/android/app/build/test-results
            apps/mobile/android/app/build/reports/tests
          if-no-files-found: error

  android-e2e:
    name: Android E2E (API ${{ matrix.api }})
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: android-e2e-apks
          path: android-e2e-apks
      - name: 安装固定 Maestro 2.12.0
        run: |
          curl --fail --location --retry 3 -o /tmp/maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 原生集成与 Maestro 用户流程
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash apps/mobile/e2e/run-ci.sh
      - name: 归档模拟器诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-api-${{ matrix.api }}
          path: test-results/android
          if-no-files-found: error

  acceptance:
    name: 全平台验收门禁
    if: always()
    needs: [quality, network-simulation, desktop-build, desktop-e2e, android-build, android-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 缺失、跳过或失败均不能通过
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) { if (job.result !== "success") throw new Error(name + ": " + job.result); }'
