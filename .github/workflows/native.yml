name: Native
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      endurance:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      endurance:
        description: Run the two-hour idle memory regression
        type: boolean
        default: false
permissions:
  contents: read
env:
  NETMATE_UPDATE_ENDPOINT: ${{ vars.NETMATE_UPDATE_ENDPOINT }}
  NETMATE_UPDATE_PUBLIC_KEY: ${{ vars.NETMATE_UPDATE_PUBLIC_KEY }}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 180
    steps:
      - name: Native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential pkg-config libgtk-4-dev libdbus-1-dev python3 python3-gi python3-pyatspi xvfb xauth dbus-x11 rpm network-manager scrot fonts-noto-cjk
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p netmate-core -p netmate-agent -p netmate-ui -- -D warnings
      - run: cargo test --locked -p netmate-core -p netmate-platform
      - run: cargo build --locked --release -p netmate-agent -p netmate-ui
      - run: python3 tools/native/package.py --skip-build --format deb
      - run: python3 tools/native/package.py --skip-build --format rpm
      - name: Build controlled OS adapter for UI tests
        run: cargo build --locked --release -p netmate-agent --features test-driver --target-dir target/ui-test
      - run: python3 tools/native/smoke_ipc.py target/ui-test/release/netmate-agent
      - run: cp target/release/netmate-ui target/ui-test/release/netmate-ui
      - name: Native accessibility and 100 window lifecycles
        run: NETMATE_BINARY_DIR="$PWD/target/ui-test/release" dbus-run-session -- xvfb-run -a python3 tools/native/smoke_linux.py
      - name: Start OS network service for production measurements
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          NetworkManager --no-daemon >/tmp/netmate-networkmanager.log 2>&1 &
      - name: Process memory and CPU
        run: dbus-run-session -- python3 tools/native/measure.py target/release/netmate-agent --seconds 600 --out dist-native/linux-background.json
      - run: python3 tools/native/check_budget.py dist-native/linux-background.json
      - name: Foreground memory
        run: dbus-run-session -- xvfb-run -a python3 tools/native/measure.py target/release/netmate-agent --ui --seconds 60 --out dist-native/linux-foreground.json
      - run: python3 tools/native/check_budget.py dist-native/linux-foreground.json
      - name: Startup distribution
        run: dbus-run-session -- xvfb-run -a python3 tools/native/startup.py target/release/netmate-agent --runs 30 --out dist-native/linux-startup.json
      - name: Two-hour regression
        if: ${{ inputs.endurance == true }}
        run: dbus-run-session -- python3 tools/native/measure.py target/release/netmate-agent --seconds 7200 --out dist-native/linux-endurance.json
      - if: ${{ inputs.endurance == true }}
        run: python3 tools/native/check_budget.py dist-native/linux-endurance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-linux-${{ matrix.arch }}
          path: dist-native/
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: cargo test --locked -p netmate-core -p netmate-platform
      - run: cargo build --locked --release -p netmate-agent -p netmate-ui
      - run: python -m pip install pywinauto psutil pillow
      - run: python tools/native/smoke_windows.py
      - run: choco install nsis -y --no-progress
      - run: python tools/native/package.py --skip-build --format exe
      - run: python tools/native/measure_desktop.py target/release/netmate-agent.exe --seconds 600 --out dist-native/windows-background.json
      - run: python tools/native/check_budget.py dist-native/windows-background.json
      - run: python tools/native/measure_desktop.py target/release/netmate-agent.exe --ui --seconds 60 --out dist-native/windows-foreground.json
      - run: python tools/native/check_budget.py dist-native/windows-foreground.json
      - run: python tools/native/startup.py target/release/netmate-agent.exe --runs 30 --out dist-native/windows-startup.json
      - if: ${{ inputs.endurance == true }}
        run: python tools/native/measure_desktop.py target/release/netmate-agent.exe --seconds 7200 --out dist-native/windows-endurance.json
      - if: ${{ inputs.endurance == true }}
        run: python tools/native/check_budget.py dist-native/windows-endurance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-${{ matrix.arch }}
          path: dist-native/
  macos:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p netmate-core -p netmate-platform
      - run: cargo build --locked --release -p netmate-agent
      - run: swift build -c release
        working-directory: apps/macos
      - run: swift test
        working-directory: apps/macos
      - run: cargo build --locked --release -p netmate-agent --features test-driver --target-dir target/ui-test
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/macos
      - name: Native macOS UI and theme snapshots
        run: |
          mkdir -p dist-native
          xcodebuild -project apps/macos/NetMate.xcodeproj -scheme NativeUITests -destination 'platform=macOS' -resultBundlePath dist-native/macos-ui.xcresult test NETMATE_AGENT_BINARY="$PWD/target/ui-test/release/netmate-agent"
      - name: Import distribution identity
        if: ${{ inputs.release && vars.APPLE_SIGNING_IDENTITY != '' }}
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: python3 tools/native/apple_signing.py
      - name: Package and sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.release && vars.APPLE_SIGNING_IDENTITY || '-' }}
        run: python3 tools/native/package.py --skip-build --format mac
      - run: python3 -m pip install psutil --break-system-packages
      - name: Measure packaged processes
        run: |
          ditto -x -k dist-native/NetMate-*-macos-arm64.zip "$RUNNER_TEMP/netmate-installed"
          python3 tools/native/measure_desktop.py "$RUNNER_TEMP/netmate-installed/NetMate.app/Contents/MacOS/netmate-agent" --seconds 600 --out dist-native/macos-background.json
          python3 tools/native/check_budget.py dist-native/macos-background.json
          python3 tools/native/measure_desktop.py "$RUNNER_TEMP/netmate-installed/NetMate.app/Contents/MacOS/netmate-agent" --ui --seconds 60 --out dist-native/macos-foreground.json
          python3 tools/native/check_budget.py dist-native/macos-foreground.json
          python3 tools/native/startup.py "$RUNNER_TEMP/netmate-installed/NetMate.app/Contents/MacOS/netmate-agent" --runs 30 --out dist-native/macos-startup.json
      - if: ${{ inputs.endurance == true }}
        run: python3 tools/native/measure_desktop.py "$RUNNER_TEMP/netmate-installed/NetMate.app/Contents/MacOS/netmate-agent" --seconds 7200 --out dist-native/macos-endurance.json
      - if: ${{ inputs.endurance == true }}
        run: python3 tools/native/check_budget.py dist-native/macos-endurance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-macos-arm64
          path: dist-native/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NETMATE_ENDURANCE: ${{ inputs.endurance }}
      ANDROID_KEYSTORE_FILE: ${{ inputs.release && format('{0}/apps/mobile/android/app/release.keystore', github.workspace) || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ inputs.release && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ inputs.release && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ inputs.release && secrets.ANDROID_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Use Command-line Tools 22.0 for dotted API levels
        run: |
          sdkmanager 'cmdline-tools;22.0'
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/bootstrap"
          ln -s 22.0 "$ANDROID_HOME/cmdline-tools/latest"
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare distribution key
        if: ${{ inputs.release }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          python3 -c 'import base64,os,pathlib;pathlib.Path(os.environ["ANDROID_KEYSTORE_FILE"]).write_bytes(base64.b64decode(os.environ["KEYSTORE"]))'
          chmod 600 "$ANDROID_KEYSTORE_FILE"
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBenchmark :app:assembleRelease --console=plain
        working-directory: apps/mobile/android
      - name: Prepare APK artifacts
        run: |
          mkdir -p dist-native
          python3 tools/native/copy_apk.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: bash tools/native/android_ci.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android
          path: |
            dist-native/
            apps/mobile/android/app/build/test-results/
            apps/mobile/android/app/build/outputs/androidTest-results/
