name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        env:
          UPDATE_ENDPOINT: ${{ vars.NETMATE_UPDATE_ENDPOINT }}
          UPDATE_PUBLIC_KEY: ${{ vars.NETMATE_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_ENDPOINT" && test -n "$UPDATE_PUBLIC_KEY"
          python3 -c 'import os,tomllib; version=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"];open(os.environ["GITHUB_OUTPUT"],"a").write("version="+version+"\n")'
  build:
    needs: prepare
    uses: ./.github/workflows/native.yml
    with:
      release: true
      endurance: true
    secrets: inherit
  draft:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-artifacts
      - run: |
          mkdir -p release-assets
          find native-artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*-android.apk' \) -exec cp {} release-assets/ \;
          python3 -m pip install cryptography
      - name: Sign update metadata and checksums
        env:
          NETMATE_UPDATE_PRIVATE_KEY: ${{ secrets.NETMATE_UPDATE_PRIVATE_KEY }}
          NETMATE_UPDATE_PUBLIC_KEY: ${{ vars.NETMATE_UPDATE_PUBLIC_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/native/manifest.py release-assets --version "$VERSION" --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
      - name: Create reviewable native release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "v$VERSION" release-assets/* --draft --target "$GITHUB_SHA" --title "NetMate v$VERSION" --generate-notes
