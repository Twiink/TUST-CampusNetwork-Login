name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_version:
        description: '可选，手动指定版本号（如 1.2.3 或 v1.2.3）'
        required: false
        type: string
      force_publish:
        description: '即使同版本 Release 已有资产，仍强制重新上传'
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: '可选，复用 Release run 产物；对应版本标签须已指向原构建提交'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '10.27.0'

jobs:
  resolve-release:
    name: 解析发布信息
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      android_version_name: ${{ steps.resolve.outputs.android_version_name }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
      existing_asset_count: ${{ steps.resolve.outputs.existing_asset_count }}
      artifact_run_id: ${{ steps.resolve.outputs.artifact_run_id }}

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 解析版本与现有 Release 状态
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id || '' }}
        run: |
          version_input="${INPUT_VERSION}"

          if [ -n "${ARTIFACT_RUN_ID}" ]; then
            [[ "${ARTIFACT_RUN_ID}" =~ ^[0-9]+$ ]] || { echo 'artifact_run_id 必须为数字'; exit 1; }
            source_info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '[.path, .head_sha, .status] | @tsv')"
            IFS=$'\t' read -r source_workflow source_sha source_status <<< "${source_info}"
            if [ "${source_workflow}" != '.github/workflows/release.yml' ] || [ "${source_status}" != 'completed' ]; then
              echo '仅支持复用已结束的 Release 运行产物'
              exit 1
            fi
            builds_ready="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.conclusion == "success") | .name] | contains(["打包 Windows EXE", "打包 macOS DMG", "打包 Linux AppImage/DEB", "打包 Android APK"])')"
            if [ "${builds_ready}" != 'true' ]; then
              echo '原运行的四个平台构建尚未全部成功，不能复用'
              exit 1
            fi
            TARGET_SHA="${source_sha}"
            if [ -z "${version_input}" ]; then
              version_input="$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/desktop/package.json?ref=${TARGET_SHA}" --jq .content | base64 --decode | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            fi
          fi

          if [ -z "${version_input}" ]; then
            version_input="$(node -p "require('./apps/desktop/package.json').version")"
          fi

          if [[ "${version_input}" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="${major}.${minor}.${patch}"
            tag="v${version}"
            android_version_code=$((10#${major} * 10000 + 10#${minor} * 100 + 10#${patch}))
          else
            echo "版本格式无效: ${version_input}，仅支持 vX.Y.Z 或 X.Y.Z"
            exit 1
          fi

          if [ -n "${ARTIFACT_RUN_ID}" ]; then
            tagged_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)" || {
              echo "复用产物前，请先创建 ${tag} 标签并指向原构建提交 ${TARGET_SHA}"
              exit 1
            }
            if [ "${tagged_sha}" != "${TARGET_SHA}" ]; then
              echo "${tag} 标签与原构建提交不一致，停止发布"
              exit 1
            fi
          fi

          release_exists=false
          existing_asset_count=0
          release_json=''

          if release_json="$(gh release view "${tag}" --json assets,url 2>/dev/null)"; then
            release_exists=true
            existing_asset_count="$(
              printf '%s' "${release_json}" | node -e "
                let data = '';
                process.stdin.on('data', (chunk) => {
                  data += chunk;
                });
                process.stdin.on('end', () => {
                  const parsed = JSON.parse(data);
                  process.stdout.write(String(parsed.assets.length));
                });
              "
            )"
          fi

          should_publish=true
          skip_reason=''

          if [ "${FORCE_PUBLISH}" != 'true' ] && [ "${release_exists}" = 'true' ] && [ "${existing_asset_count}" -gt 0 ]; then
            should_publish=false
            skip_reason="Release ${tag} 已存在且包含 ${existing_asset_count} 个资产，跳过自动发布。"
          fi

          {
            echo "should_publish=${should_publish}"
            echo "skip_reason=${skip_reason}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "android_version_name=${version}"
            echo "android_version_code=${android_version_code}"
            echo "target_sha=${TARGET_SHA}"
            echo "release_exists=${release_exists}"
            echo "existing_asset_count=${existing_asset_count}"
            echo "artifact_run_id=${ARTIFACT_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: 验证目标提交的两轮完整 CI（含手动与产物复用）
        if: steps.resolve.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node shell/release-gate.mjs "$GITHUB_REPOSITORY" "${{ steps.resolve.outputs.target_sha }}" "${{ steps.resolve.outputs.version }}"

      - name: 输出跳过原因
        if: steps.resolve.outputs.should_publish != 'true'
        run: echo "${{ steps.resolve.outputs.skip_reason }}"

  build-windows:
    name: 打包 Windows EXE
    runs-on: windows-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true' && needs.resolve-release.outputs.artifact_run_id == ''
    timeout-minutes: 40

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备发布版本号
        run: pnpm release:prepare-version -- ${{ needs.resolve-release.outputs.tag }}

      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/native/Cargo.lock', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: 构建原生模块
        run: |
          cargo test -p netmate-native
          cargo build -p netmate-native --release
          mkdir -p packages/native/win32-x64
          cp target/release/netmate_native.dll packages/native/win32-x64/netmate_native.win32-x64-msvc.node
      - name: 验证原生模块加载与 API 冒烟
        shell: bash
        run: |
          node - <<'NODE'
          const n = require('./packages/native');
          if (n.__loadError) throw new Error(n.__loadError);
          for (const fn of ['currentWifi', 'networkInfo', 'watchNetwork']) {
            if (typeof n[fn] !== 'function') throw new Error(`missing export: ${fn}`);
          }
          const wifi = n.currentWifi();
          const info = n.networkInfo();
          if (wifi !== null && typeof wifi !== 'object') throw new Error('invalid currentWifi result');
          if (info !== null && typeof info !== 'object') throw new Error('invalid networkInfo result');
          if (info) {
            for (const key of ['ipv4', 'ipv6', 'mac', 'gateway', 'subnetMask']) {
              const value = info[key];
              if (value !== undefined && value !== null && typeof value !== 'string') {
                throw new Error(`invalid networkInfo.${key}`);
              }
            }
            if (!Array.isArray(info.dns ?? [])) throw new Error('invalid networkInfo.dns');
          }
          console.log(`native smoke ok: wifi=${wifi ? 'object' : 'null'}, info=${info ? 'object' : 'null'}`);
          NODE
      - name: 构建 Windows 安装包
        run: pnpm dist:win

      - name: 安装 EXE 并验证正式程序
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release -Recurse -Filter '*.exe' | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'NetMateSmoke'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait
          node shell/packaged-smoke.mjs "$destination/NetMate.exe" "${{ needs.resolve-release.outputs.version }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-windows
          path: release-smoke
          if-no-files-found: error

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-exe
          # latest.yml 与 blockmap 是 electron-updater 发现/下载更新的必需资产
          path: |
            apps/desktop/release/**/*.exe
            apps/desktop/release/**/latest.yml
            apps/desktop/release/**/*.blockmap
            apps/desktop/dist/**/*.exe
            !apps/desktop/release/**/win-unpacked/**
          if-no-files-found: error

  build-macos:
    name: 打包 macOS DMG
    runs-on: macos-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true' && needs.resolve-release.outputs.artifact_run_id == ''
    timeout-minutes: 40

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备发布版本号
        run: pnpm release:prepare-version -- ${{ needs.resolve-release.outputs.tag }}

      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/native/Cargo.lock', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: 构建原生模块
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test -p netmate-native
          mkdir -p packages/native/darwin-arm64 packages/native/darwin-x64
          cargo build -p netmate-native --release --target aarch64-apple-darwin
          cargo build -p netmate-native --release --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/libnetmate_native.dylib packages/native/darwin-arm64/netmate_native.darwin-arm64.node
          cp target/x86_64-apple-darwin/release/libnetmate_native.dylib packages/native/darwin-x64/netmate_native.darwin-x64.node
      - name: 验证原生模块加载与 API 冒烟
        shell: bash
        run: |
          node - <<'NODE'
          const n = require('./packages/native');
          if (n.__loadError) throw new Error(n.__loadError);
          for (const fn of ['currentWifi', 'networkInfo', 'watchNetwork']) {
            if (typeof n[fn] !== 'function') throw new Error(`missing export: ${fn}`);
          }
          const wifi = n.currentWifi();
          const info = n.networkInfo();
          if (wifi !== null && typeof wifi !== 'object') throw new Error('invalid currentWifi result');
          if (info !== null && typeof info !== 'object') throw new Error('invalid networkInfo result');
          if (info) {
            for (const key of ['ipv4', 'ipv6', 'mac', 'gateway', 'subnetMask']) {
              const value = info[key];
              if (value !== undefined && value !== null && typeof value !== 'string') {
                throw new Error(`invalid networkInfo.${key}`);
              }
            }
            if (!Array.isArray(info.dns ?? [])) throw new Error('invalid networkInfo.dns');
          }
          console.log(`native smoke ok: wifi=${wifi ? 'object' : 'null'}, info=${info ? 'object' : 'null'}`);
          NODE
      - name: 构建 macOS 安装包
        run: pnpm dist:mac

      - name: 挂载 DMG 并验证正式程序
        run: |
          image=$(find apps/desktop/release -name '*.dmg' -type f | head -n 1)
          mkdir -p /tmp/netmate-release-smoke
          hdiutil attach "$image" -nobrowse -mountpoint /tmp/netmate-release-smoke
          installation=$(mktemp -d /tmp/netmate-installed.XXXXXX)
          ditto /tmp/netmate-release-smoke/NetMate.app "$installation/NetMate.app"
          hdiutil detach /tmp/netmate-release-smoke
          node shell/packaged-smoke.mjs "$installation/NetMate.app" "${{ needs.resolve-release.outputs.version }}"
          archive=$(find apps/desktop/release -name '*-Mac-*.zip' -type f | head -n 1)
          unzip -t "$archive" > /tmp/netmate-mac-zip-check.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-macos
          path: release-smoke
          if-no-files-found: error

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-dmg
          # latest-mac.yml 与 zip 供 electron-updater 在 macOS 上检查/下载更新
          path: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/latest-mac.yml
            apps/desktop/release/**/*-Mac-*.zip
            apps/desktop/release/**/*.blockmap
            apps/desktop/dist/**/*.dmg
          if-no-files-found: error

  build-linux:
    name: 打包 Linux AppImage/DEB
    runs-on: ubuntu-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true' && needs.resolve-release.outputs.artifact_run_id == ''
    timeout-minutes: 40

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备发布版本号
        run: pnpm release:prepare-version -- ${{ needs.resolve-release.outputs.tag }}

      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/native/Cargo.lock', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: 构建原生模块
        run: |
          cargo test -p netmate-native
          cargo build -p netmate-native --release
          mkdir -p packages/native/linux-x64-gnu
          cp target/release/libnetmate_native.so packages/native/linux-x64-gnu/netmate_native.linux-x64-gnu.node
      - name: 验证原生模块加载与 API 冒烟
        shell: bash
        run: |
          node - <<'NODE'
          const n = require('./packages/native');
          if (n.__loadError) throw new Error(n.__loadError);
          for (const fn of ['currentWifi', 'networkInfo', 'watchNetwork']) {
            if (typeof n[fn] !== 'function') throw new Error(`missing export: ${fn}`);
          }
          const wifi = n.currentWifi();
          const info = n.networkInfo();
          if (wifi !== null && typeof wifi !== 'object') throw new Error('invalid currentWifi result');
          if (info !== null && typeof info !== 'object') throw new Error('invalid networkInfo result');
          if (info) {
            for (const key of ['ipv4', 'ipv6', 'mac', 'gateway', 'subnetMask']) {
              const value = info[key];
              if (value !== undefined && value !== null && typeof value !== 'string') {
                throw new Error(`invalid networkInfo.${key}`);
              }
            }
            if (!Array.isArray(info.dns ?? [])) throw new Error('invalid networkInfo.dns');
          }
          console.log(`native smoke ok: wifi=${wifi ? 'object' : 'null'}, info=${info ? 'object' : 'null'}`);
          NODE
      - name: 构建 Linux 安装包
        run: pnpm dist:linux

      - name: 解包 AppImage 并验证正式程序与 DEB
        run: |
          image=$(find "$PWD/apps/desktop/release" -name '*.AppImage' -type f | head -n 1)
          chmod +x "$image"
          mkdir -p /tmp/netmate-release-smoke
          (cd /tmp/netmate-release-smoke && "$image" --appimage-extract >/dev/null)
          xvfb-run -a node shell/packaged-smoke.mjs /tmp/netmate-release-smoke/squashfs-root "${{ needs.resolve-release.outputs.version }}"
          package=$(find apps/desktop/release -name '*.deb' -type f | head -n 1)
          test "$(dpkg-deb -f "$package" Version)" = "${{ needs.resolve-release.outputs.version }}"
          dpkg-deb -x "$package" /tmp/netmate-deb
          test -n "$(find /tmp/netmate-deb -name '*.node' -type f | head -n 1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-linux
          path: release-smoke
          if-no-files-found: error

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-packages
          # latest-linux.yml 与 blockmap 供 electron-updater 在 Linux 上检查/下载更新
          path: |
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/latest-linux.yml
            apps/desktop/release/**/*.blockmap
            apps/desktop/dist/**/*.AppImage
          if-no-files-found: error

  build-android:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true' && needs.resolve-release.outputs.artifact_run_id == ''
    timeout-minutes: 60
    env:
      ANDROID_VERSION_NAME: ${{ needs.resolve-release.outputs.android_version_name }}
      ANDROID_VERSION_CODE: ${{ needs.resolve-release.outputs.android_version_code }}

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 设置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建共享包
        run: pnpm build:shared

      - name: 校验 Hermes 编译器
        run: test -x node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: 校验 Android 发布签名 secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS}" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD}" ] || missing+=("ANDROID_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "缺少 Android 发布签名 secrets: ${missing[*]}"
            exit 1
          fi

      - name: 准备 Android 发布签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > apps/mobile/android/app/release.keystore

      - name: 构建 Android Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/apps/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x apps/mobile/android/gradlew
          pnpm dist:android

      - name: 核验正式签名、版本码、策略及旧版本升级条件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous-release
          mkdir -p release-smoke
          gh release download v1.0.1 --pattern '*universal*.apk' --dir previous-release
          previous=$(find previous-release -name '*.apk' -type f | head -n 1)
          bash shell/verify-android-apks.sh apps/mobile/android/app/build/outputs/apk/release "$previous" "${{ needs.resolve-release.outputs.version }}" 2>&1 | tee release-smoke/android-apk-verification.txt

      - name: 安装固定 Maestro 2.12.0
        run: |
          curl --fail --location --retry 3 -o /tmp/maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 真实 v1.0.1 保留配置升级安装验证
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash shell/smoke-android-upgrade.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-android
          path: release-smoke
          if-no-files-found: error

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v7
        with:
          name: release-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-windows
      - build-macos
      - build-linux
      - build-android
    if: |
      !cancelled() &&
      needs.resolve-release.result == 'success' &&
      needs.resolve-release.outputs.should_publish == 'true' &&
      (
        needs.resolve-release.outputs.artifact_run_id != '' ||
        (
          needs.build-windows.result == 'success' &&
          needs.build-macos.result == 'success' &&
          needs.build-linux.result == 'success' &&
          needs.build-android.result == 'success'
        )
      )
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - name: 检出验收提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v8
        with:
          name: release-windows-exe
          path: release-assets/windows
          run-id: ${{ needs.resolve-release.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v8
        with:
          name: release-macos-dmg
          path: release-assets/macos
          run-id: ${{ needs.resolve-release.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v8
        with:
          name: release-linux-packages
          path: release-assets/linux
          run-id: ${{ needs.resolve-release.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 Android 产物
        uses: actions/download-artifact@v8
        with:
          name: release-android-apk
          path: release-assets/android
          run-id: ${{ needs.resolve-release.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 复核门禁并验证附件、更新元数据和校验清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node shell/release-gate.mjs "$GITHUB_REPOSITORY" "${{ needs.resolve-release.outputs.target_sha }}" "${{ needs.resolve-release.outputs.version }}" release-assets/validation.json
          node shell/validate-release-assets.mjs release-assets "${{ needs.resolve-release.outputs.version }}"

      - name: 上传草稿并下载核验后正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag }}
          TARGET_SHA: ${{ needs.resolve-release.outputs.target_sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          mapfile -d '' -t assets < <(find release-assets -type f -print0 | sort -z)
          if gh release view "$TAG_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG_NAME" --json isDraft -q .isDraft)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)" = "$TARGET_SHA"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            target_args=(--target "$TARGET_SHA")
            if tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha 2>/dev/null); then
              test "$tagged_sha" = "$TARGET_SHA"
              target_args=(--verify-tag)
            fi
            gh release create "$TAG_NAME" "${assets[@]}" --draft --title "NetMate $TAG_NAME" --generate-notes "${target_args[@]}"
          fi
          mkdir downloaded-assets
          gh release download "$TAG_NAME" --dir downloaded-assets
          (cd downloaded-assets && sha256sum -c SHA256SUMS)
          node shell/validate-release-assets.mjs downloaded-assets "$VERSION"
          node shell/release-gate.mjs "$GITHUB_REPOSITORY" "$TARGET_SHA" "$VERSION"
          gh release edit "$TAG_NAME" --draft=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG_NAME"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].url' | while IFS= read -r url; do curl --fail --silent --show-error --location --head "$url" >/dev/null; done
