name: Native Android startup
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NETMATE_UPDATE_ENDPOINT: ${{ vars.NETMATE_UPDATE_ENDPOINT }}
  NETMATE_UPDATE_PUBLIC_KEY: ${{ vars.NETMATE_UPDATE_PUBLIC_KEY }}
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install current Android tools
        run: |
          sdkmanager 'cmdline-tools;22.0'
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/bootstrap"
          ln -s 22.0 "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - run: bash gradlew :app:testDebugUnitTest :app:assembleBenchmark --console=plain
        working-directory: apps/mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: bash tools/native/android_startup.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-startup-diagnostic
          path: |
            dist-native/
            apps/mobile/android/app/build/test-results/
