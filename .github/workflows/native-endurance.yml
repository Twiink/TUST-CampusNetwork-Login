name: Native endurance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 160
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 libgtk-4-1 libdbus-1-3 dbus-x11 network-manager
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-${{ matrix.arch }}
          path: installation-artifacts
      - name: Start native network integration
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          NetworkManager --no-daemon >/tmp/netmate-networkmanager.log 2>&1 &
      - name: Two hours on packaged background processes
        run: dbus-run-session -- python3 tools/native/endurance_desktop.py installation-artifacts --out endurance/linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endurance-linux-${{ matrix.arch }}
          path: endurance/
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install psutil
      - uses: actions/download-artifact@v8
        with:
          name: native-windows-${{ matrix.arch }}
          path: installation-artifacts
      - name: Two hours on installed background processes
        run: python tools/native/endurance_desktop.py installation-artifacts --out endurance/windows-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endurance-windows-${{ matrix.arch }}
          path: endurance/
  macos:
    runs-on: xcode-27
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install psutil --break-system-packages
      - uses: actions/download-artifact@v8
        with:
          name: native-macos-arm64
          path: installation-artifacts
      - name: Two hours on packaged background processes
        run: python3 tools/native/endurance_desktop.py installation-artifacts --out endurance/macos-arm64.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endurance-macos-arm64
          path: endurance/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Use Command-line Tools 22.0
        run: |
          sdkmanager 'cmdline-tools;22.0'
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/bootstrap"
          ln -s 22.0 "$ANDROID_HOME/cmdline-tools/latest"
      - uses: actions/download-artifact@v8
        with:
          name: native-android
          path: installation-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: bash tools/native/android_endurance.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endurance-android
          path: endurance/
