[package]
name = "netmate-agent"
version.workspace = true
edition.workspace = true
[dependencies]
netmate-core = { path = "../../packages/netmate-core" }
netmate-platform = { path = "../../packages/netmate-platform" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "signal"] }
futures-util = "0.3"
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization"] }
[features]
test-driver = []
