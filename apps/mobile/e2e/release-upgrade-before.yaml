appId: com.netmate.app
---
- launchApp
- extendedWaitUntil:
    visible: '配置设置|跳过|暂不'
    timeout: 30000
- repeat:
    while:
      visible: '跳过|暂不'
    commands:
      - tapOn: '跳过|暂不'
- tapOn: '配置设置'
- scrollUntilVisible:
    element: '请输入学号/用户名'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '请输入学号/用户名'
- inputText: 'upgrade-fixture'
- pressKey: enter
- scrollUntilVisible:
    element: '请输入密码'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '请输入密码'
- inputText: 'upgrade-fixture-password'
- pressKey: enter
- scrollUntilVisible:
    element: '保存并添加账号'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '保存并添加账号'
- scrollUntilVisible:
    element: '删除账号 upgrade-fixture'
    direction: UP
    timeout: 60000
    centerElement: true
- assertVisible: '删除账号 upgrade-fixture'
- stopApp
