appId: com.netmate.app
---
- launchApp
- extendedWaitUntil:
    visible: '配置设置|跳过|暂不'
    timeout: 30000
- repeat:
    while:
      visible: '跳过|暂不'
    commands:
      - tapOn: '跳过|暂不'
- tapOn: '配置设置'
- scrollUntilVisible:
    element: '请输入学号/用户名'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '请输入学号/用户名'
- inputText: 'upgrade-fixture'
- pressKey: enter
# v1.0.1's ScrollView consumes the first outside tap after text input.
# End that input explicitly before attempting another control's action.
- tapOn: '用户名'
- assertVisible: 'upgrade-fixture'
- scrollUntilVisible:
    element: '请输入密码'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '请输入密码'
- inputText: 'upgrade-fixture-password'
- pressKey: enter
- tapOn: '密码'
- scrollUntilVisible:
    element: '保存并添加账号'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: '保存并添加账号'
- scrollUntilVisible:
    element: '删除账号 upgrade-fixture'
    direction: UP
    timeout: 60000
    centerElement: true
- assertVisible: '删除账号 upgrade-fixture'
- takeScreenshot: upgrade-saved-v1.0.1
- stopApp
- launchApp
- tapOn: '配置设置'
- scrollUntilVisible:
    element: '删除账号 upgrade-fixture'
    direction: DOWN
    timeout: 60000
    centerElement: true
- assertVisible: '删除账号 upgrade-fixture'
- stopApp
