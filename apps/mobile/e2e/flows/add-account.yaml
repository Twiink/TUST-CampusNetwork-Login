appId: com.netmate.app.e2e
---
- scrollUntilVisible:
    centerElement: true
    timeout: 60000
    speed: 80
    element: { id: 'add-username' }
    direction: DOWN
- tapOn: { id: 'add-username' }
- inputText: ${USERNAME}
- pressKey: enter
- scrollUntilVisible:
    centerElement: true
    element: { id: 'add-account-password' }
    direction: DOWN
    timeout: 60000
    speed: 80
- tapOn: { id: 'add-account-password' }
- inputText: 'fake-password'
- pressKey: enter
- scrollUntilVisible:
    centerElement: true
    timeout: 60000
    speed: 80
    element: '保存并添加账号'
    direction: DOWN
- tapOn: '保存并添加账号'
- extendedWaitUntil:
    visible: '配置已保存并同步'
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    element: '编辑账号 ${USERNAME}'
    direction: UP
    timeout: 60000
    speed: 80
- assertVisible: '编辑账号 ${USERNAME}'
- scrollUntilVisible:
    centerElement: true
    element: { id: 'add-username' }
    direction: DOWN
    timeout: 60000
    speed: 80
