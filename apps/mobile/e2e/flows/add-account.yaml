appId: com.netmate.app.e2e
---
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    timeout: 60000
    speed: 40
    element: { id: 'add-username' }
    direction: DOWN
- tapOn: { id: 'add-username' }
- inputText: ${USERNAME}
- pressKey: enter
- assertVisible: { id: 'add-username', text: '${USERNAME}' }
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    element: { id: 'add-account-password' }
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: { id: 'add-account-password' }
- inputText: 'fake-password'
- pressKey: enter
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    timeout: 60000
    speed: 40
    element: { id: 'add-account' }
    direction: DOWN
- tapOn: { id: 'add-account' }
- extendedWaitUntil:
    visible: '配置已保存并同步'
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    element: '编辑账号 ${USERNAME}'
    direction: UP
    timeout: 60000
    speed: 40
- assertVisible: '编辑账号 ${USERNAME}'
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    element: { id: 'add-username' }
    direction: DOWN
    timeout: 60000
    speed: 40
