appId: com.netmate.app.e2e
---
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    { element: '检查更新', direction: DOWN, timeout: 60000, speed: 40, centerElement: true }
- tapOn: '检查更新'
- scrollUntilVisible:
    element: '下载更新'
    direction: DOWN
    timeout: 15000
    speed: 40
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn: '下载更新'
- extendedWaitUntil:
    visible: 'APK 签名不匹配'
    timeout: 90000
- assertVisible: '重试下载'
