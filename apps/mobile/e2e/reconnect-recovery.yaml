appId: com.netmate.app.e2e
---
- launchApp
- extendedWaitUntil:
    visible: '断开连接'
    timeout: 60000
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    centerElement: true
    timeout: 60000
    speed: 80
    element: '连接 WiFi TUST-WIFI'
    direction: DOWN
- tapOn: '连接 WiFi TUST-WIFI'
- tapOn: { id: 'tab-home' }
- assertVisible: '.*WiFi 已关联.*'
