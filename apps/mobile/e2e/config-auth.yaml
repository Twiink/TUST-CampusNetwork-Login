appId: com.netmate.app.e2e
---
- launchApp
- extendedWaitUntil:
    visible: '配置设置|跳过|暂不'
    timeout: 30000
- repeat:
    while:
      visible: '跳过|暂不'
    commands:
      - tapOn: '跳过|暂不'
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'auto-reconnect' }
    direction: DOWN
- tapOn: { id: 'auto-reconnect' }
- runFlow: { file: 'flows/add-account.yaml', env: { USERNAME: 'reject' } }
- runFlow: { file: 'flows/add-account.yaml', env: { USERNAME: 'accept' } }
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'scan-wifi' }
    direction: UP
- tapOn: { id: 'scan-wifi' }
- scrollUntilVisible:
    element: '选择网络 TUST-WIFI'
    direction: DOWN
    timeout: 60000
    speed: 80
- tapOn: '选择网络 TUST-WIFI'
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: '选择账号 reject'
    direction: DOWN
- tapOn: '选择账号 reject'
- scrollUntilVisible:
    element: '选择账号 accept'
    direction: DOWN
    timeout: 60000
    speed: 80
- tapOn: '选择账号 accept'
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'add-wifi' }
    direction: DOWN
- tapOn: { id: 'add-wifi' }
- extendedWaitUntil:
    visible: '配置已保存并同步'
    timeout: 15000
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: '编辑账号 accept'
    direction: UP
- tapOn: '编辑账号 accept'
- assertVisible: { id: 'edit-username' }
- tapOn: { id: 'edit-username' }
- eraseText
- inputText: 'accept-edited'
- hideKeyboard
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'save-edit' }
    direction: DOWN
- tapOn: { id: 'save-edit' }
- tapOn: { id: 'tab-home' }
- scrollUntilVisible:
    element: '立即连接'
    direction: DOWN
    timeout: 60000
    speed: 80
- tapOn: '立即连接'
- extendedWaitUntil:
    visible: '断开连接'
    timeout: 25000
- tapOn: '断开连接'
- scrollUntilVisible:
    element: '自动认证已暂停'
    direction: UP
    timeout: 60000
    speed: 80
- assertVisible: '自动认证已暂停'
- stopApp
- launchApp
- assertVisible: '自动认证已暂停'
- tapOn: '恢复自动认证'
- assertNotVisible: '自动认证已暂停'
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'wifi-retries' }
    direction: DOWN
- tapOn: { id: 'wifi-retries' }
- eraseText
- inputText: '1'
- hideKeyboard
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'wifi-cooldown' }
    direction: DOWN
- tapOn: { id: 'wifi-cooldown' }
- eraseText
- inputText: '0'
- hideKeyboard
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: { id: 'auto-reconnect' }
    direction: UP
- tapOn: { id: 'auto-reconnect' }
- repeat:
    while:
      visible: '跳过|暂不'
    commands:
      - tapOn: '跳过|暂不'
- tapOn: { id: 'tab-logs' }
- assertVisible: '导出日志'
- tapOn: '导出日志'
- back
- tapOn: { id: 'tab-home' }
