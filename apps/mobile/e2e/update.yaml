appId: com.netmate.app.e2e
---
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    timeout: 60000
    speed: 40
    element: '检查更新'
    direction: DOWN
- tapOn: '检查更新'
- scrollUntilVisible:
    element: '下载更新'
    direction: DOWN
    timeout: 15000
    speed: 40
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn: '下载更新'
- extendedWaitUntil:
    visible: '取消下载'
    timeout: 15000
- stopApp
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    centerElement: true
    waitToSettleTimeoutMs: 1000
    timeout: 60000
    speed: 40
    element: '取消下载'
    direction: DOWN
- assertVisible: '下载进度.*'
- tapOn: '取消下载'
- assertNotVisible: '取消下载'
