appId: com.netmate.app.e2e
---
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    { element: '检查更新', direction: DOWN, timeout: 60000, speed: 40, centerElement: true }
- tapOn: '检查更新'
- scrollUntilVisible:
    element: '重试下载'
    direction: DOWN
    timeout: 15000
    speed: 40
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn: '重试下载'
- extendedWaitUntil:
    visible: '授权安装更新'
    timeout: 90000
- tapOn: '授权安装更新'
- tapOn: { text: 'Allow from this source|允许来自此来源的应用', optional: true }
- back
- extendedWaitUntil: { visible: '安装更新', timeout: 10000 }
- tapOn: '安装更新'
- tapOn: 'Update|更新|Install|安装'
- extendedWaitUntil: { visible: 'Done|完成|Open|打开', timeout: 60000 }
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    {
      element: '当前版本 1.0.2-e2e',
      direction: DOWN,
      timeout: 60000,
      speed: 40,
      centerElement: true,
    }
- assertVisible: '当前版本 1.0.2-e2e'
- scrollUntilVisible:
    { element: '更新已安装', direction: DOWN, timeout: 15000, speed: 40, centerElement: true }
- extendedWaitUntil: { visible: '更新已安装', timeout: 15000 }
