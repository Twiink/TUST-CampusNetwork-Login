appId: com.netmate.app.e2e
---
- launchApp
- tapOn: { id: 'tab-settings' }
- runFlow: { file: 'flows/add-account.yaml', env: { USERNAME: 'temporary' } }
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: '编辑账号 temporary'
    direction: UP
- tapOn: '编辑账号 temporary'
- tapOn: { id: 'edit-username' }
- eraseText
- inputText: 'temporary-edited'
- hideKeyboard
- scrollUntilVisible: { element: { id: 'save-edit' }, direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: { id: 'save-edit' }
- stopApp
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    timeout: 60000
    speed: 80
    element: '删除账号 temporary-edited'
    direction: DOWN
- tapOn: '删除账号 temporary-edited'
- assertNotVisible: '删除账号 temporary-edited'
- scrollUntilVisible: { element: { id: 'scan-wifi' }, direction: UP, timeout: 60000, speed: 80 }
- tapOn: { id: 'scan-wifi' }
- tapOn: '选择网络 Nearby-WIFI'
- scrollUntilVisible:
    { element: { id: 'add-wifi-password' }, direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: { id: 'add-wifi-password' }
- inputText: 'e2e-wifi-pass'
- hideKeyboard
- scrollUntilVisible:
    { element: { id: 'add-requires-auth' }, direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: { id: 'add-requires-auth' }
- scrollUntilVisible: { element: { id: 'add-wifi' }, direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: { id: 'add-wifi' }
- scrollUntilVisible: { element: '编辑 WiFi Nearby-WIFI', direction: UP, timeout: 60000, speed: 80 }
- tapOn: '编辑 WiFi Nearby-WIFI'
- tapOn: '编辑 WiFi 名称'
- eraseText
- inputText: 'Nearby-edited'
- hideKeyboard
- scrollUntilVisible: { element: { id: 'save-edit' }, direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: { id: 'save-edit' }
- stopApp
- launchApp
- tapOn: { id: 'tab-settings' }
- scrollUntilVisible:
    { element: '删除 WiFi Nearby-edited', direction: DOWN, timeout: 60000, speed: 80 }
- tapOn: '删除 WiFi Nearby-edited'
- assertNotVisible: '删除 WiFi Nearby-edited'
- tapOn: { id: 'tab-home' }
