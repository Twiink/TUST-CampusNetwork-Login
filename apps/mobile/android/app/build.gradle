plugins { id 'com.android.application' }
def nativeVersion = (rootProject.file('../../../Cargo.toml').text =~ /(?m)^version = "([^"]+)"$/)[0][1]
def nativeParts = nativeVersion.tokenize('.').collect { it.toInteger() }
// Keep every native release above the previous per-ABI versionCode range.
def nativeCode = (nativeParts[0] * 10000 + nativeParts[1] * 100 + nativeParts[2]) * 10
def signingFile = System.getenv('ANDROID_KEYSTORE_FILE')
def signedRelease = signingFile && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')
android {
    namespace 'com.netmate.app'
    compileSdk 37
    defaultConfig {
        applicationId 'com.netmate.app'
        minSdk 37
        targetSdk 37
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: nativeCode.toString())
        versionName System.getenv('ANDROID_VERSION_NAME') ?: nativeVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [usesCleartextTraffic: false]
        buildConfigField 'String', 'UPDATE_ENDPOINT', '"' + (System.getenv('NETMATE_UPDATE_ENDPOINT') ?: '') + '"'
        buildConfigField 'String', 'UPDATE_PUBLIC_KEY', '"' + (System.getenv('NETMATE_UPDATE_PUBLIC_KEY') ?: '') + '"'
    }
    buildFeatures { aidl true; buildConfig true }
    signingConfigs {
        if (signedRelease) { release { storeFile file(signingFile); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } }
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-native.pro'; if (signedRelease) signingConfig signingConfigs.release }
        benchmark { initWith release; signingConfig signingConfigs.debug; matchingFallbacks = ['release']; manifestPlaceholders = [usesCleartextTraffic: false] }
        debug { applicationIdSuffix '.debug' }
    }
    sourceSets {
        main { java { exclude '**/*Module.kt', '**/*Package.kt', '**/bridge/**' } }
        test { resources.srcDir(rootProject.file('../../../packages/shared/fixtures')) }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude '**/*Module.kt', '**/*Package.kt', '**/bridge/**', '**/PlatformRuntime.kt'
}
