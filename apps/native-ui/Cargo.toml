[package]
name = "netmate-ui"
version.workspace = true
edition.workspace = true
[dependencies]
netmate-core = { path = "../../packages/netmate-core" }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11", default-features = false, features = ["v4_16"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
