<!doctype html>
<!--
  NetMate「校园一卡通」原型：Linux GTK 版重设计的视觉依据（2026-10-31）。
  日夜切换按钮的样式与结构逐字取自 toggle-pen.html（16px 每 em），不属于本次重设计。
  顶部的状态按钮只用于原型切换首页场景，不在应用中出现。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetMate 校园一卡通原型</title>
    <style>
      :root {
        --font: 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
        --ground: #ecebe6;
        --field: #f6f5f1;
        --line: #d6d4cd;
        --ink: #1d2329;
        --text: #1d2329;
        --text-2: #5c636a;
        --faint: #b5b2aa;
        --gold: #c9a24a;
        --gold-text: #87661c;
        --gold-soft: rgba(201, 162, 74, 0.18);
        --ok: #2f7d5b;
        --warn: #9a5f0c;
        --bad: #b8372b;
        --rail: #1d2329;
        --rail-2: #2b333b;
        --rail-text: #e8e6df;
        --rail-text-2: #9aa1a7;
        --face-a: #26313b;
        --face-b: #1a2128;
        --face-text: #f1efe8;
        --face-text-2: #a9afb5;
        --deck-1: #cfcdc6;
        --deck-2: #dddbd5;
        --primary: #1d2329;
        --on-primary: #ffffff;
      }
      html.dark {
        --ground: #14181c;
        --field: #1b2026;
        --line: #2a3138;
        --ink: #e8e6df;
        --text: #e8e6df;
        --text-2: #9aa1a7;
        --faint: #3a434c;
        --gold: #d9b85e;
        --gold-text: #d9b85e;
        --gold-soft: rgba(217, 184, 94, 0.16);
        --ok: #5cc795;
        --warn: #e8a94e;
        --bad: #f07b6e;
        --rail: #0d1013;
        --rail-2: #1d2329;
        --face-a: #323d47;
        --face-b: #232a32;
        --deck-1: #262c33;
        --deck-2: #1f252b;
        --primary: #d9b85e;
        --on-primary: #1a1606;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font: 14px/1.5 var(--font);
        color: var(--text);
        background: #c3c2bc;
        display: grid;
        justify-content: center;
        align-content: start;
        gap: 14px;
        padding: 18px;
        transition: background-color 0.3s ease;
      }
      html.dark body { background: #050607; }
      ::selection { background: var(--gold); color: #1a1606; }
      .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      /* Prototype controls, not part of the app. */
      .proto { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #33393f; }
      html.dark .proto { color: #8b939a; }
      .proto button { font: inherit; border: 1px solid #9a9890; background: #f3f2ee; color: #1d2329; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
      .proto button[aria-pressed='true'] { background: #1d2329; color: #fff; border-color: #1d2329; }

      .window {
        width: 1100px; height: 820px; display: grid; grid-template-columns: 200px 1fr;
        background: var(--ground); border-radius: 10px; overflow: hidden;
        box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.55);
        transition: background-color 0.3s ease;
      }
      svg.i { width: 16px; height: 16px; flex: none; }

      /* Rail */
      .rail { background: var(--rail); color: var(--rail-text); padding: 26px 14px 20px; display: flex; flex-direction: column; transition: background-color 0.3s ease; }
      /* Brand: a small card with its chip, the same object as the home page. */
      .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 40px; }
      .brand-card { width: 30px; height: 21px; border-radius: 4px; flex: none; position: relative; background: linear-gradient(135deg, #3a4651, #2a333c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
      .brand-card::after { content: ''; position: absolute; left: 5px; top: 6px; width: 9px; height: 7px; border-radius: 2px; background: linear-gradient(135deg, #ecd48c, #b88f35); }
      .brand b { display: block; font-size: 18px; font-weight: 700; line-height: 1.15; letter-spacing: 0.01em; }
      .brand small { display: block; font-size: 11.5px; line-height: 1.3; color: var(--rail-text-2); }
      .navs { display: grid; gap: 4px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      .rail .nav {
        all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px;
        height: 42px; padding: 0 12px; border-radius: 8px; color: var(--rail-text-2); font-size: 15px; font-weight: 500; letter-spacing: 0.02em;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .rail .nav svg { width: 18px; height: 18px; }
      .rail .nav:hover { color: var(--rail-text); background: rgba(255, 255, 255, 0.05); }
      .rail .nav[aria-current='page'] { color: #fff; background: var(--rail-2); font-weight: 600; }
      .rail .nav[aria-current='page'] svg { color: var(--gold); }
      .rail .nav:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
      .rail-foot { margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--rail-text-2); }

      /* Main */
      .main { padding: 26px 32px 24px; overflow: auto; display: flex; flex-direction: column; gap: 24px; }
      .main::-webkit-scrollbar { width: 10px; }
      .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 3px solid var(--ground); }
      .head { display: flex; align-items: center; gap: 14px; min-height: 40px; }
      .head h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
      .head p { font-size: 13px; color: var(--text-2); }
      .grow { flex: 1; }

      /* Buttons and fields */
      .btn {
        font: inherit; font-weight: 500; font-size: 13.5px; height: 34px; padding: 0 15px; border-radius: 8px; cursor: pointer; white-space: nowrap;
        color: var(--text); background: var(--field); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px;
      }
      .btn:hover { border-color: var(--text-2); }
      .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
      .btn.danger { color: var(--bad); }
      .btn.quiet { background: transparent; border-color: transparent; color: var(--text-2); padding: 0 8px; height: 28px; }
      .btn.quiet:hover { color: var(--text); background: var(--field); }
      .input {
        font: inherit; height: 34px; padding: 0 12px; border-radius: 8px; color: var(--text);
        background: var(--field); border: 1px solid var(--line); outline: none; min-width: 0;
      }
      .input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
      .input::placeholder { color: var(--text-2); }
      select.input { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(-45deg, transparent 50%, var(--text-2) 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }

      /* Sections: ink title rule and hairline rows, no card containers. */
      .sec h2 {
        font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--text);
        display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 1.5px solid var(--ink); min-height: 34px;
      }
      .sec h2 small { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--text-2); }
      .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
      .stack { display: grid; gap: 24px; }

      /* Home: the account card */
      .hero { display: grid; grid-template-columns: 440px 1fr; gap: 20px 40px; align-items: center; }
      .deck { position: relative; height: 276px; margin-top: 22px; }
      .card {
        position: absolute; inset: 0; border-radius: 16px; padding: 22px 24px 22px;
        background: linear-gradient(135deg, var(--face-a), var(--face-b)); color: var(--face-text);
        display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 20px 34px -20px rgba(10, 14, 18, 0.6);
      }
      .card.d1 { transform: translate(16px, -11px) scale(0.965); background: var(--deck-1); box-shadow: none; }
      .card.d2 { transform: translate(30px, -21px) scale(0.93); background: var(--deck-2); box-shadow: none; }
      .card.d1, .card.d2 { border: 1px solid var(--line); }
      .card .top { display: flex; justify-content: space-between; font-size: 11.5px; letter-spacing: 0.12em; color: var(--face-text-2); }
      .chip { width: 46px; height: 34px; border-radius: 7px; margin: 18px 0 14px; background: linear-gradient(135deg, #ecd48c, #b88f35); position: relative; flex: none; }
      .chip::before, .chip::after { content: ''; position: absolute; border: 1px solid rgba(80, 58, 14, 0.38); }
      .chip::before { inset: 8px 15px; border-radius: 3px; }
      .chip::after { left: 0; right: 0; top: 16px; border-width: 1px 0 0; }
      .status { display: flex; align-items: center; gap: 13px; font-size: 34px; font-weight: 700; line-height: 1.15; letter-spacing: 0.01em; }
      .lamp { width: 12px; height: 12px; border-radius: 50%; flex: none; background: #5cc795; box-shadow: 0 0 0 5px rgba(92, 199, 149, 0.2); }
      .lamp.warn { background: #e8a94e; box-shadow: 0 0 0 5px rgba(232, 169, 78, 0.22); }
      .lamp.bad { background: #f07b6e; box-shadow: 0 0 0 5px rgba(240, 123, 110, 0.22); }
      .lamp.idle { background: #9aa1a7; box-shadow: 0 0 0 5px rgba(154, 161, 167, 0.2); }
      .cardno { margin-top: auto; font-size: 19px; letter-spacing: 0.2em; }
      .meta { display: flex; gap: 26px; margin-top: 8px; font-size: 11px; color: var(--face-text-2); }
      .meta b { display: block; font-size: 13px; font-weight: 500; color: var(--face-text); }
      /* The magnetic stripe doubles as the retry progress while recovering. */
      .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, 0.08); }
      .stripe i { display: block; height: 100%; background: #e8a94e; }
      /* Without an account (or a WiFi) the card is an empty outline. */
      .card.void { background: transparent; color: var(--text); border: 1.5px dashed var(--faint); box-shadow: none; }
      .card.void .top, .card.void .meta { color: var(--text-2); }
      .card.void .meta b { color: var(--text); }
      .card.void .chip { background: var(--line); }
      .card.void .chip::before, .card.void .chip::after { border-color: transparent; }
      .card.void .cardno { color: var(--faint); }

      .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .side h2 { font-size: 21px; font-weight: 700; }
      .side p { color: var(--text-2); }
      .notes { display: flex; flex-wrap: wrap; gap: 6px; }
      .note { font-size: 12px; padding: 1px 8px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-2); }
      .note.gold { border-color: var(--gold); color: var(--gold-text); }
      .note.bad { border-color: var(--bad); color: var(--bad); }
      .acts { display: flex; gap: 8px; margin-top: 2px; }
      .metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1.5px solid var(--ink); }
      .m { padding: 9px 0 0 16px; border-left: 1px solid var(--line); min-width: 0; }
      .m:first-child { padding-left: 0; border-left: none; }
      .m small { display: block; font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
      .m b { font-size: 18px; font-weight: 700; }
      .m em { font-style: normal; font-size: 11.5px; color: var(--text-2); margin-left: 3px; }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

      .cols { display: grid; grid-template-columns: 1fr 1.15fr; gap: 32px; align-items: start; }
      .kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); min-height: 42px; }
      .kv span { color: var(--text-2); }
      .kv b { font-weight: 500; text-align: right; }
      .wifi { display: grid; grid-template-columns: 44px 1fr 92px 70px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .wifi .n { font-size: 21px; font-weight: 700; color: var(--faint); }
      .wifi.cur .n { color: var(--gold); }
      .wifi small, .rule small { display: block; font-size: 12px; color: var(--text-2); }
      .wifi .name, .rule .name { font-weight: 600; }
      .tag { justify-self: start; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
      .tag.auth { border-color: var(--gold); color: var(--gold-text); }
      .wifi .btn { justify-self: end; height: 28px; padding: 0 12px; }
      .here { justify-self: end; display: inline-flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 600; color: var(--ok); }
      .here svg { width: 14px; height: 14px; }
      .pause { padding: 12px 0; color: var(--text-2); }
      .fail { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .fail small { color: var(--text-2); font-size: 12.5px; }

      /* Settings */
      .set { display: grid; grid-template-columns: 1fr auto; gap: 2px 24px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .set label { font-weight: 500; }
      .set p { font-size: 12.5px; color: var(--text-2); }
      .set > :last-child { grid-row: 1 / span 2; grid-column: 2; }
      .switch { appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; transition: background-color 0.2s ease; }
      .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.2s ease; }
      .switch:checked { background: var(--ok); }
      .switch:checked::after { transform: translateX(16px); }
      .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .step { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 34px; background: var(--field); }
      .step button { all: unset; width: 32px; text-align: center; cursor: pointer; color: var(--text-2); font-size: 16px; }
      .step button:hover { color: var(--text); background: var(--line); }
      .step input { all: unset; width: 54px; text-align: center; border-inline: 1px solid var(--line); font-family: var(--mono); }
      .acct { display: grid; grid-template-columns: 58px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .mini { width: 58px; height: 38px; border-radius: 6px; background: linear-gradient(135deg, var(--face-a), var(--face-b)); position: relative; }
      .mini::after { content: ''; position: absolute; left: 7px; top: 9px; width: 14px; height: 10px; border-radius: 2px; background: linear-gradient(135deg, #ecd48c, #b88f35); }
      .mini.off { background: var(--line); }
      .mini.off::after { background: var(--faint); }
      .acct b { font-family: var(--mono); font-weight: 600; letter-spacing: 0.06em; }
      .acct small { display: block; font-size: 12px; color: var(--text-2); }
      .acct .btns { display: flex; gap: 6px; align-items: center; }
      .inuse { font-size: 12.5px; font-weight: 600; color: var(--ok); margin-right: 6px; }
      .form { display: grid; grid-template-columns: 1fr 1fr 150px auto; gap: 10px; align-items: end; padding: 14px 0 4px; }
      .field { display: grid; gap: 5px; font-size: 12.5px; color: var(--text-2); }
      .rule { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
      .rule .n { font-size: 21px; font-weight: 700; color: var(--gold); }
      .near { display: grid; grid-template-columns: 1fr auto; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
      .near small { color: var(--text-2); font-size: 12px; margin-left: 8px; }

      /* Logs */
      .tools { display: flex; gap: 8px; align-items: center; padding: 12px 0 10px; }
      .search { position: relative; flex: 1; }
      .search svg { position: absolute; left: 10px; top: 9px; color: var(--text-2); }
      .search .input { width: 100%; padding-left: 34px; }
      .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--field); border: 1px solid var(--line); }
      .seg button { all: unset; cursor: pointer; padding: 3px 11px; border-radius: 5px; font-size: 12.5px; color: var(--text-2); }
      .seg button:hover { color: var(--text); }
      .seg button[aria-pressed='true'] { background: var(--ink); color: var(--ground); }
      .loglist { border-top: 1.5px solid var(--ink); }
      .log { display: grid; grid-template-columns: 160px 46px 84px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
      .log time, .log .src { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
      .lv { font-size: 12px; font-weight: 700; }
      .lv.info { color: var(--text-2); } .lv.success { color: var(--ok); } .lv.warn { color: var(--warn); } .lv.err { color: var(--bad); } .lv.debug { color: var(--text-2); font-weight: 400; }
      .logfoot { display: flex; gap: 8px; align-items: center; padding-top: 12px; }

      /* About */
      .about-hero { display: grid; grid-template-columns: 320px 1fr; gap: 36px; align-items: center; }
      .about-hero .card { position: relative; height: 200px; }
      .about-hero h2 { font-size: 30px; font-weight: 700; }
      .about-hero p { color: var(--text-2); max-width: 36em; }
      .feat { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
      .feat svg { color: var(--ok); }
      .link { color: var(--gold-text); font-weight: 600; text-decoration: none; }
      .link:hover { text-decoration: underline; text-underline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

      /* ---- Day/night toggle: toggle-pen.html verbatim, --base-scale 16px. ---- */
      .theme-toggle {
        --base-scale: 16px;
        --toggle-width: 5.625em;
        --toggle-height: 2.5em;
        --radius-pill: 100em;
        --sun-diameter: 2.125em;
        --sun-offset: calc((var(--toggle-height) - var(--sun-diameter)) / 2);
        --bg-toggle-light: #3d7eae;
        --bg-toggle-dark: #1d1f2c;
        --color-sun: #ecca2f;
        --color-moon: #c4c9d1;
        --color-crater: #959db1;
        --color-star: #fff;
        --color-cloud-front: #f3fdff;
        --color-cloud-back: #aacadf;
        --shadow-primary: rgba(0, 0, 0, 0.25);
        --shadow-highlight: rgba(255, 255, 255, 0.94);
        --halo-color: rgba(255, 255, 255, 0.1);
      }
      .theme-toggle { font-size: var(--base-scale); background: none; border: none; }
      .theme-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 100em; }
      .theme-toggle__container {
        width: var(--toggle-width); height: var(--toggle-height); background-color: var(--bg-toggle-light);
        border-radius: var(--radius-pill); cursor: pointer; position: relative;
        transition: background-color 0.3s ease; overflow: hidden;
        box-shadow: 0.06em 0.06em 0.125em var(--shadow-highlight);
      }
      html.dark .theme-toggle__container { background-color: var(--bg-toggle-dark); }
      .theme-toggle__container::after {
        content: ''; position: absolute; inset: 0; box-shadow: 0em 0.05em 0.187em rgba(0, 0, 0, 0.5) inset;
        border-radius: var(--radius-pill); pointer-events: none;
      }
      .theme-toggle__sun {
        width: var(--sun-diameter); height: var(--sun-diameter); background-color: var(--color-sun); border-radius: 50%;
        position: absolute; top: var(--sun-offset); transform: translateX(var(--sun-offset));
        box-shadow: 0.05em 0.125em 0.125em var(--shadow-primary), 0em 0.05em 0.125em var(--shadow-primary),
          0.05em 0.05em 0.05em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.05em 0.05em 0em #a1872a inset, 0 0 0 0.625em var(--halo-color),
          0 0 0 1.25em var(--halo-color), 0 0 0 1.875em var(--halo-color);
        transition: transform 0.3s ease; overflow: hidden;
      }
      html.dark .theme-toggle__container .theme-toggle__sun { transform: translateX(calc(var(--toggle-width) - var(--sun-diameter) - var(--sun-offset))); }
      .theme-toggle__moon-mask {
        position: relative; width: 100%; height: 100%; background-color: var(--color-moon); border-radius: inherit;
        transform: translateX(100%); transition: transform 0.3s ease;
        box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #969696 inset;
      }
      html.dark .theme-toggle__container .theme-toggle__moon-mask { transform: translateX(0); }
      .theme-toggle__crater { position: absolute; background-color: var(--color-crater); border-radius: 50%; box-shadow: 0em 0.03em 0.06em var(--shadow-primary) inset; }
      .theme-toggle__crater:nth-of-type(1) { top: 0.75em; left: 0.3em; width: 0.75em; height: 0.75em; }
      .theme-toggle__crater:nth-of-type(2) { top: 0.9em; left: 1.375em; width: 0.375em; height: 0.375em; }

    <script>
      const ic = (d) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
      const I = {
        home: ic('<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/>'),
        settings: ic('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'),
        logs: ic('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>'),
        about: ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
        refresh: ic('<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>'),
        search: ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
        check: ic('<path d="M20 6 9 17l-5-5"/>'),
      };
      const NAV = [['home', '运行状态', I.home], ['settings', '配置设置', I.settings], ['logs', '运行日志', I.logs], ['about', '关于', I.about]];
      const S = { page: 'home', net: 'online', level: '全部' };
      const root = document.documentElement;

      const card = (v) => `
        <div class="card ${v.void ? 'void' : ''}">
          <div class="top"><span>TUST · 校园网认证</span><span>${v.where}</span></div>
          <div class="chip"></div>
          <div class="status"><span class="lamp ${v.lamp}"></span>${v.title}</div>
          <div class="cardno num">${v.no}</div>
          <div class="meta">${v.meta.map(([k, x]) => `<span>${k}<b>${x}</b></span>`).join('')}</div>
          ${v.stripe != null ? `<div class="stripe" role="progressbar" aria-label="尝试进度" aria-valuenow="${v.stripe}"><i style="width:${v.stripe}%"></i></div>` : ''}
        </div>`;

      const HOME = {
        online: {
          deck: 2, lamp: '', title: '已认证并联网', where: 'TUST', no: '2023 1012 34',
          meta: [['运营商', '中国移动'], ['认证顺序', '1 / 2'], ['WiFi 规则', '需要认证']],
          h: '一切正常', p: '当前 WiFi 已通过认证且可访问互联网。断线时后台会自动重连。',
          notes: '<span class="note gold">此 WiFi 已配置为「需要认证」</span><span class="note">如校园网 CMCC/CUCC/CTCC</span>',
          acts: '<button class="btn">断开连接</button>', net: true,
        },
        recover: {
          deck: 2, lamp: 'warn', title: '正在认证', where: 'TUST', no: '2023 1012 34', stripe: 66,
          meta: [['目标 WiFi', 'TUST'], ['尝试', '第 2 / 3 次'], ['重试', '12 秒后']],
          h: '正在恢复连接', p: '目标 WiFi：TUST。门户响应慢，正在用第 1 个账号重新认证。',
          notes: '<span class="note">剩余 12 秒后重试</span>',
          acts: '<button class="btn primary">立即重试</button><button class="btn">停止恢复</button>', net: false,
        },
        failed: {
          deck: 2, lamp: 'bad', title: '恢复失败', where: 'TUST', no: '2023 1012 34', stripe: 100,
          meta: [['已尝试', '3 个 WiFi'], ['冷却', '4 分 32 秒'], ['心跳检测', '已暂停']],
          h: '所有 WiFi 连接失败', p: '按优先级依次尝试了 3 个已配置的 WiFi，均未能恢复。冷却结束后会再试一轮。',
          notes: '<span class="note bad">冷却中</span>',
          acts: '<button class="btn primary">立即重试</button><button class="btn">恢复自动认证</button>', net: false, fails: true,
        },
        offline: {
          deck: 0, void: true, lamp: 'bad', title: '未连接 WiFi', where: '无 WiFi', no: '•••• •••• ••',
          meta: [['WiFi', '无'], ['心跳检测', '已暂停']],
          h: '先连上 WiFi', p: '当前设备未连接到任何 WiFi 网络，请先连接 WiFi。连接到 WiFi 后才能使用网络认证功能。',
          notes: '<span class="note bad">心跳检测已暂停</span>', acts: '', off: true,
        },
        noacct: {
          deck: 0, void: true, lamp: 'idle', title: '未配置账户', where: 'TUST', no: '•••• •••• ••',
          meta: [['WiFi 规则', '需要认证'], ['关联账户', '无']],
          h: '还差一个账号', p: '该 WiFi 需要校园网认证，但尚未关联账户。请前往「配置设置」添加账户并关联到此 WiFi。',
          notes: '', acts: '<button class="btn primary">添加认证账号</button>', net: false,
        },
      };

      function home() {
        const V = HOME[S.net];
        const deck = [V.deck > 1 ? '<div class="card d2"></div>' : '', V.deck > 0 ? '<div class="card d1"></div>' : ''].join('');
        const metrics = V.off ? '' : `<div class="metrics">
          <div class="m"><small>信号强度</small><b class="num">72%</b><em class="ok">良好</em></div>
          <div class="m"><small>连接速度</small><b class="num">206</b><em>Mbps</em></div>
          <div class="m"><small>频段</small><b>5GHz</b></div>
          <div class="m"><small>互联网</small><b class="${V.net ? 'ok' : 'bad'}">${V.net ? '可达' : '不可达'}</b></div>
          <div class="m"><small>心跳 · 每 30 秒</small><b class="${V.net ? 'ok' : 'bad'}">${V.net ? '正常' : '异常'}</b><em class="num">18s</em></div></div>`;
        const kv = [['WiFi 名称', 'TUST', ''], ['IPv4 地址', '10.48.13.127', 'num'], ['IPv6 地址', '2001:da8:a005:330::23', 'num'], ['BSSID', '28:e4:24:2c:e5:c0', 'num'], ['WiFi 信道', '36', 'num'], ['安全类型', 'WPA2 个人', '']];
        const left = V.off
          ? `<div class="sec"><h2>心跳检测 (已暂停)</h2><p class="pause">当前未连接 WiFi，心跳检测功能暂停。连接到 WiFi 后将自动恢复检测。</p></div>`
          : V.fails
          ? `<div class="sec"><h2>本轮尝试</h2>${[['TUST', '认证失败：门户超时', '3 次'], ['TUST-5G', '未找到该 WiFi', '1 次'], ['宿舍热点', '连接被拒绝', '3 次']]
              .map(([a, b, c]) => `<div class="fail"><b>${a}</b><span>${c}</span><small>${b}</small></div>`).join('')}</div>`
          : `<div class="sec"><h2>网络详情<span class="grow"></span><button class="btn quiet" aria-label="刷新 WiFi 信息" title="刷新 WiFi 信息">${I.refresh}</button></h2>
            ${kv.map(([k, v, c]) => `<div class="kv"><span>${k}</span><b class="${c}">${v}</b></div>`).join('')}</div>`;
        const cur = S.net === 'online';
        const w = (n, name, sub, auth, isCur) => `<div class="wifi ${isCur ? 'cur' : ''}"><span class="n num">${String(n).padStart(2, '0')}</span>
          <div><div class="name">${name}</div><small>优先级 ${n} · ${sub}</small></div>
          <span class="tag ${auth ? 'auth' : ''}">${auth ? '校园网认证' : '普通热点'}</span>
          ${isCur ? `<span class="here">${I.check}当前</span>` : `<button class="btn" aria-label="切换到 ${name}">切换</button>`}</div>`;
        return `<div class="head"><h1>运行状态</h1></div>
          <section class="hero" aria-label="网络连接状态">
            <div class="deck">${deck}${card(V)}</div>
            <div class="side"><h2>${V.h}</h2><p>${V.p}</p>${V.notes ? `<div class="notes">${V.notes}</div>` : ''}${V.acts ? `<div class="acts">${V.acts}</div>` : ''}</div>${metrics}
          </section>
          <section class="cols">${left}
            <div class="sec"><h2>切换 WiFi<span class="grow"></span><small>按优先级排序</small></h2>
              ${w(1, 'TUST', 'WPA2 个人', true, cur)}${w(2, 'TUST-5G', 'WPA2 个人', true, false)}${w(10, '宿舍热点', 'WPA3 个人', false, false)}</div>
          </section>`;
      }

      const set = (label, desc, on) => `<div class="set"><label>${label}</label>${desc ? `<p>${desc}</p>` : ''}<input type="checkbox" role="switch" class="switch" aria-label="${label}" ${on ? 'checked' : ''}></div>`;
      const step = (label, v) => `<div class="set"><label>${label}</label><div class="step"><button aria-label="减少">−</button><input class="num" value="${v}" aria-label="${label}"><button aria-label="增加">+</button></div></div>`;
      function settings() {
        return `<div class="head"><h1>配置设置</h1><p>修改后立即保存并生效</p></div>
          <section class="sec" aria-label="账号配置"><h2>账号管理<span class="grow"></span><small>按顺序依次认证</small></h2>
            <div class="acct"><div class="mini"></div><div><b>2023101234</b><small>中国移动</small></div><div class="btns"><span class="inuse">使用中</span><button class="btn">编辑</button><button class="btn danger">删除</button></div></div>
            <div class="acct"><div class="mini off"></div><div><b>2023105678</b><small>校园网</small></div><div class="btns"><button class="btn">使用此账号</button><button class="btn">编辑</button><button class="btn danger">删除</button></div></div>
            <div class="form"><label class="field">用户名<input class="input" placeholder="请输入学号/用户名"></label><label class="field">密码<input class="input" type="password" placeholder="请输入密码"></label>
              <label class="field">运营商<select class="input" aria-label="运营商"><option>校园网</option><option selected>中国移动</option><option>中国联通</option><option>中国电信</option></select></label><button class="btn primary">保存并添加账号</button></div></section>
          <section class="sec"><h2>WiFi 配置<span class="grow"></span><button class="btn quiet">添加 WiFi</button></h2>
            <div class="rule"><span class="n num">01</span><div><div class="name">TUST</div><small>关联账号 2023101234 · 断开后自动重连</small></div><span class="tag auth">需要认证</span><button class="btn">编辑</button></div>
            <div class="rule"><span class="n num">02</span><div><div class="name">TUST-5G</div><small>关联账号 2023101234 · 断开后自动重连</small></div><span class="tag auth">需要认证</span><button class="btn">编辑</button></div>
            <div class="rule"><span class="n num">10</span><div><div class="name">宿舍热点</div><small>手动连接</small></div><span class="tag">无需认证</span><button class="btn">编辑</button></div></section>
          <div class="twocol">
            <section class="sec"><h2>通用设置</h2>
              ${set('开机自动启动', '', false)}${set('启用心跳检测', '按间隔检测网络；关闭后仅在 WiFi 变化时检测，另有 30 秒兜底检查', true)}${set('断线自动重连', '认证失效时自动登录；WiFi 断开时按优先级重连', true)}${set('启动时自动连接', '启动时若未连接 WiFi，按优先级连接已配置的 WiFi', false)}${set('保持当前连接', '启动时已连接其他 WiFi 则不切换', true)}${set('自动检查更新', '启动后自动检查新版本', true)}
              ${step('心跳检测间隔 (秒)', 30)}${step('连续失败阈值 (次)', 3)}${step('每个 WiFi 最多尝试次数（含首次）', 3)}${step('冷却期时长 (分钟，0 为不冷却)', 5)}</section>
            <div class="stack">
              <section class="sec"><h2>附近 WiFi<span class="grow"></span><button class="btn quiet">扫描附近 WiFi</button></h2>
                <div class="near"><span>TUST<small>72% · WPA2 · 已保存</small></span><button class="btn">编辑</button></div>
                <div class="near"><span>CMCC-EDU<small>41% · 开放</small></span><button class="btn">选择</button></div></section>
              <section class="sec"><h2>通知设置</h2>${set('WiFi 断开', '', true)}${set('自动重连成功', '', true)}${set('自动重连全部失败', '', true)}${set('认证恢复成功', '', false)}</section>
            </div></div>`;
      }

      const LOGS = [
        ['11:52:14', 'success', '成功', 'auth', '认证成功 · TUST · 2023101234'],
        ['11:52:10', 'info', '信息', 'network', 'verifying · TUST'],
        ['11:52:10', 'info', '信息', 'network', 'authenticating · TUST'],
        ['11:52:06', 'info', '信息', 'network', 'connecting · TUST'],
        ['11:51:58', 'warn', '警告', 'heartbeat', '心跳检测失败 1 / 3，门户返回超时'],
        ['11:48:30', 'err', '错误', 'auth', '认证失败：账号或密码错误（2023105678）'],
        ['11:40:02', 'debug', '调试', 'agent', '网络事件监听已连接 NetworkManager'],
        ['11:30:00', 'info', '信息', 'heartbeat', '心跳检测正常'],
        ['11:20:00', 'info', '信息', 'heartbeat', '心跳检测正常'],
        ['11:10:41', 'success', '成功', 'network', '已连接 TUST（优先级 1）'],
      ];
      function logs() {
        const lv = ['全部', '信息', '成功', '警告', '错误', '调试'];
        const rows = LOGS.filter((l) => S.level === '全部' || l[2] === S.level)
          .map((l) => `<div class="log" tabindex="0"><time class="num">2026-10-31 ${l[0]}</time><span class="lv ${l[1]}">${l[2]}</span><span class="src">${l[3]}</span><span>${l[4]}</span></div>`).join('')
          || '<p style="padding:28px 0;text-align:center;color:var(--text-2)">没有匹配的日志</p>';
        return `<div class="head"><h1>运行日志</h1><p>连接、认证与恢复记录</p><span class="grow"></span><button class="btn" aria-label="搜索 / 刷新">${I.refresh}刷新</button></div>
          <section class="sec"><h2>筛选<span class="grow"></span><small>共 29 条，已加载 29 条</small></h2>
            <div class="tools"><div class="search">${I.search}<input class="input" placeholder="搜索消息或详情" aria-label="搜索全部保留历史"></div>
              <input class="input" style="width:120px" placeholder="全部来源" aria-label="来源">
              <div class="step"><button aria-label="减少">−</button><input class="num" value="0" aria-label="最近小时（0=全部）"><button aria-label="增加">+</button></div>
              <button class="btn">筛选</button></div>
            <div class="seg" role="group" aria-label="级别">${lv.map((x) => `<button data-level="${x}" aria-pressed="${S.level === x}">${x}</button>`).join('')}</div></section>
          <section class="sec"><div class="loglist">${rows}</div>
            <div class="logfoot"><button class="btn">上一页</button><button class="btn">下一页</button><span class="grow"></span>
              <select class="input" aria-label="导出范围"><option>全部保留日志</option><option>当前筛选结果</option></select>
              <select class="input" aria-label="格式"><option>可读文本 LOG</option><option>结构化 JSON</option></select>
              <button class="btn">导出日志</button><button class="btn danger">清除日志</button></div></section>`;
      }

      function about() {
        const f = ['WiFi 自动重连（三阶段优先级切换）', '校园网认证自动登录', '多账户管理', '网络状态监控', '心跳检测与断线重连'];
        return `<div class="head"><h1>关于</h1></div>
          <section class="about-hero"><div class="card"><div class="top"><span>NETMATE</span><span class="num">v2.0.0</span></div><div class="chip"></div><div class="status">NetMate</div><div class="cardno num" style="font-size:14px">TUST CAMPUS NETWORK</div></div>
            <div><h2>NetMate</h2><p>智能 WiFi 管理工具。装好后放着不管，断线时自动重连、自动完成校园网认证。</p></div></section>
          <div class="twocol"><section class="sec"><h2>核心功能</h2>${f.map((x) => `<div class="feat">${I.check}${x}</div>`).join('')}</section>
            <div class="stack"><section class="sec"><h2>更新检查</h2><div class="kv"><span>当前已是最新版本 <span class="num">v2.0.0</span></span><button class="btn primary">检查更新</button></div></section>
              <section class="sec"><h2>项目信息</h2><div class="kv"><a class="link" href="#">GitHub 仓库</a><a class="link" href="#">问题反馈</a></div>
                <div class="kv"><span style="font-size:12.5px">© 2026 NetMate. All rights reserved.</span><button class="btn danger">退出 NetMate</button></div></section></div></div>`;
      }

      function render() {
        document.querySelector('.navs').innerHTML = NAV.map(([k, t, i]) => `<button class="nav" data-page="${k}" ${S.page === k ? 'aria-current="page"' : ''}>${i}${t}</button>`).join('');
        document.querySelector('.main').innerHTML = { home, settings, logs, about }[S.page]();
        document.querySelectorAll('[data-net]').forEach((b) => b.setAttribute('aria-pressed', S.page === 'home' && b.dataset.net === S.net));
      }

      const toggle = document.getElementById('theme-toggle-btn');
      function updateTheme(dark) {
        root.classList.toggle('dark', dark);
        toggle.setAttribute('aria-checked', String(dark));
        const name = dark ? '切换至白天模式' : '切换至黑夜模式';
        toggle.setAttribute('aria-label', name);
        toggle.title = name;
      }
      toggle.addEventListener('click', () => updateTheme(!root.classList.contains('dark')));

      document.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || b === toggle) return;
        if (b.dataset.page) S.page = b.dataset.page;
        else if (b.dataset.net) { S.net = b.dataset.net; S.page = 'home'; }
        else if (b.dataset.level) S.level = b.dataset.level;
        else return;
        render();
      });

      // Prototype deep links: ?page=logs&net=recover&dark=1
      const q = new URLSearchParams(location.search);
      if (q.get('page')) S.page = q.get('page');
      if (q.get('net')) S.net = q.get('net');
      updateTheme(q.get('dark') === '1');
      render();
    </script>
  </body>
</html>
